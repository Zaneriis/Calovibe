<div id="cv-preview" class="viz-carousel" aria-label="Maquettes du parcours ajout Calovibe" data-previous-label="Précédent" data-next-label="Suivant">
  <section data-variant="Ordinateur · clair" data-theme="light" data-layout="desktop"></section>
  <section data-variant="Ordinateur · sombre" data-theme="dark" data-layout="desktop" hidden></section>
  <section data-variant="Téléphone · clair" data-theme="light" data-layout="phone" hidden></section>
  <section data-variant="Téléphone · sombre" data-theme="dark" data-layout="phone" hidden></section>
</div>
<style>
#cv-preview{width:100%}
#cv-preview>section{min-height:1060px}
#cv-preview .cv-app{--cv-bg:#f5f4fa;--cv-surface:#fff;--cv-ink:#252438;--cv-muted:#69677c;--cv-line:#e9e7f0;--cv-accent:#6750ce;--cv-soft:#eeebfc;--cv-green:#257956;--cv-blue:#3675b9;--cv-gold:#a4761e;--cv-track:#eceaf2;--cv-r:22px;background:var(--cv-bg);color:var(--cv-ink);font:400 14px/1.5 'Segoe UI',sans-serif;border-radius:24px;overflow:clip;min-width:0}
#cv-preview [data-theme=dark] .cv-app{--cv-bg:#15151e;--cv-surface:#22222e;--cv-ink:#f3f1fa;--cv-muted:#b5b2c7;--cv-line:#353442;--cv-accent:#b1a0ff;--cv-soft:#34304c;--cv-green:#8cdbb4;--cv-blue:#8cbeee;--cv-gold:#e3bf74;--cv-track:#393846}

#cv-preview button{cursor:pointer;color:inherit}
#cv-preview button:focus-visible,#cv-preview input:focus-visible{outline:3px solid var(--cv-accent);outline-offset:3px}
#cv-preview .cv-nav{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:12px;padding:12px;text-align:left;color:var(--cv-muted)}
#cv-preview .cv-nav[aria-current=page]{background:var(--cv-soft);color:var(--cv-accent);font-weight:600}
#cv-preview .cv-side-foot{margin-top:auto;color:var(--cv-muted);font-size:12px;padding:10px}
#cv-preview .cv-content{padding:30px 26px;min-width:0}
#cv-preview .cv-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:25px}
#cv-preview .cv-eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--cv-muted);font-weight:600}
#cv-preview h1{font-size:30px;line-height:1.15;letter-spacing:-1.2px;margin:5px 0 7px;font-weight:650}
#cv-preview h2{font-size:17px;margin:0;font-weight:600;letter-spacing:-.3px}
#cv-preview p{margin:0}
#cv-preview .cv-muted{color:var(--cv-muted)}
#cv-preview .cv-small{font-size:12px}
#cv-preview .cv-pill{border:0;border-radius:14px;background:var(--cv-accent);color:var(--cv-bg);padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}
#cv-preview .cv-icon-btn{border:1px solid var(--cv-line);border-radius:12px;background:var(--cv-surface);width:44px;min-height:44px;display:inline-grid;place-items:center;flex-shrink:0}

#cv-preview .cv-days{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr)) 44px;gap:6px;margin-bottom:26px;align-items:center}
#cv-preview .cv-day{border:0;background:transparent;padding:9px 2px;border-radius:16px;display:grid;gap:3px;justify-items:center;min-width:0;min-height:62px;color:var(--cv-muted)}
#cv-preview .cv-day strong{font-size:17px;font-weight:600;color:var(--cv-ink)}
#cv-preview .cv-day[aria-pressed=true]{background:var(--cv-accent);color:var(--cv-bg)}
#cv-preview .cv-day[aria-pressed=true] strong{color:inherit}
#cv-preview .cv-layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:20px;align-items:start}
#cv-preview .cv-overview{grid-column:2;grid-row:1;display:grid;gap:14px}
#cv-preview .cv-journal{grid-column:1;grid-row:1;display:grid;gap:14px;min-width:0}
#cv-preview .cv-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 2px}
#cv-preview .cv-card{background:var(--cv-surface);border:1px solid var(--cv-line);border-radius:var(--cv-r);padding:18px;min-width:0}
#cv-preview .cv-energy{background:var(--cv-soft);border-color:transparent}
#cv-preview .cv-energy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#cv-preview .cv-energy-top svg{color:var(--cv-accent)}
#cv-preview .cv-ring{width:152px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--cv-accent) 0deg 174deg,var(--cv-track) 174deg 360deg);padding:10px;margin:0 auto 17px;display:grid;place-items:center}
#cv-preview .cv-ring-core{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cv-soft)}
#cv-preview .cv-ring strong{font-size:30px;font-weight:650;letter-spacing:-1px;line-height:1.2;font-variant-numeric:tabular-nums}
#cv-preview .cv-energy-total{text-align:center;margin-bottom:19px}
#cv-preview .cv-macro{margin-top:13px}
#cv-preview .cv-between{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#cv-preview .cv-track{height:6px;background:var(--cv-track);border-radius:8px;overflow:hidden;margin-top:7px}
#cv-preview .cv-track span{display:block;height:100%;background:var(--cv-green);border-radius:8px}
#cv-preview .cv-macro:nth-of-type(2) .cv-track span{background:var(--cv-blue)}
#cv-preview .cv-macro:nth-of-type(3) .cv-track span{background:var(--cv-gold)}
#cv-preview .cv-water-number{font-size:25px;letter-spacing:-.8px;font-weight:600;margin-top:12px;font-variant-numeric:tabular-nums}
#cv-preview .cv-water-number small{font-size:12px;color:var(--cv-muted);font-weight:400;letter-spacing:0}
#cv-preview .cv-water-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"glass extra" "bottle custom";gap:8px;margin-top:14px}
#cv-preview .cv-water-actions .cv-soft-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;height:60px;min-width:0;padding:8px 5px;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
#cv-preview .cv-water-actions [data-water="250"]{grid-area:glass}
#cv-preview .cv-water-actions [data-water="500"]{grid-area:bottle}
#cv-preview .cv-water-actions [data-water="1000"]{grid-area:extra}
#cv-preview .cv-water-custom{grid-area:custom}
#cv-preview .cv-phone .cv-water-actions{grid-template-columns:minmax(0,1fr);grid-template-areas:"glass" "bottle" "extra" "custom"}
#cv-preview .cv-phone .cv-water-actions .cv-soft-btn{height:48px}
@media(max-width:600px){#cv-preview .cv-water-actions{grid-template-columns:minmax(0,1fr);grid-template-areas:"glass" "bottle" "extra" "custom"}#cv-preview .cv-water-actions .cv-soft-btn{height:48px}}
#cv-preview .cv-water-heading{display:flex;align-items:center;gap:6px;color:var(--cv-blue)}
#cv-preview .cv-water-heading h2{color:var(--cv-ink)}
#cv-preview .cv-edit-goal{border:0;background:transparent;color:var(--cv-muted);display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:10px}
#cv-preview .cv-water-dialog{background:var(--cv-surface);color:var(--cv-ink);border:1px solid var(--cv-line);border-radius:22px;padding:24px;width:min(360px,calc(100% - 32px));max-width:100%;box-shadow:0 20px 70px #0004}
#cv-preview .cv-water-dialog::backdrop{background:#1116;backdrop-filter:blur(3px)}
#cv-preview .cv-water-dialog label{display:grid;gap:8px;margin:20px 0 6px;color:var(--cv-muted)}
#cv-preview .cv-water-dialog input{width:100%;padding:12px;border:1px solid var(--cv-line);border-radius:12px;background:var(--cv-bg);color:var(--cv-ink);font-size:18px;min-height:48px}
#cv-preview .cv-water-dialog .cv-entry-actions{justify-content:flex-end;margin-top:20px}
#cv-preview .cv-water-note{margin-top:8px;color:var(--cv-muted);font-size:12px}
#cv-preview .cv-soft-btn{border:0;border-radius:10px;background:var(--cv-soft);color:var(--cv-accent);padding:8px 11px;min-height:40px;font-weight:500}
#cv-preview .cv-undo{border:0;background:transparent;color:var(--cv-muted);text-decoration:underline;padding:8px 0;min-height:40px}
#cv-preview .cv-meal-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
#cv-preview .cv-meal-head .cv-icon-btn{margin-left:auto;background:var(--cv-soft);border:0;color:var(--cv-accent)}
#cv-preview .cv-meal-symbol{width:35px;height:35px;display:grid;place-items:center;color:var(--cv-accent);border-radius:11px;background:var(--cv-soft)}
#cv-preview .cv-meal-title{font-weight:600;font-size:15px}
#cv-preview .cv-food{display:flex;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--cv-line)}
#cv-preview .cv-food-art{width:43px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--cv-bg);color:var(--cv-muted);flex-shrink:0}
#cv-preview .cv-food-text{min-width:0;flex:1;overflow-wrap:anywhere}
#cv-preview .cv-food-name{font-weight:500}
#cv-preview .cv-food-values{color:var(--cv-muted);font-size:12px;margin-top:3px}
#cv-preview .cv-food-kcal{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
#cv-preview .cv-empty{padding:8px 0 0;color:var(--cv-muted);font-size:12px}
#cv-preview .cv-bottom{display:none;background:var(--cv-surface);border-top:1px solid var(--cv-line);padding:10px 6px;justify-content:space-around;gap:3px;flex-wrap:wrap}
#cv-preview .cv-bottom button{border:0;background:transparent;color:var(--cv-muted);font-size:11px;display:grid;justify-items:center;gap:5px;padding:8px;min-height:44px}
#cv-preview .cv-bottom button[aria-current=page]{color:var(--cv-accent)}
#cv-preview .cv-status{min-height:22px;font-size:12px;color:var(--cv-muted);margin-top:12px}
#cv-preview .cv-entry{margin-top:16px;padding-top:16px;border-top:1px solid var(--cv-line)}
#cv-preview .cv-methods{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
#cv-preview .cv-entry label{display:grid;gap:6px;margin-bottom:10px;color:var(--cv-muted);font-size:12px}
#cv-preview .cv-entry input{width:100%;padding:10px;border:1px solid var(--cv-line);border-radius:10px;background:var(--cv-bg);color:var(--cv-ink);min-height:44px;font-size:16px}
#cv-preview .cv-entry-actions{display:flex;gap:9px;flex-wrap:wrap}
#cv-preview .cv-phone{max-width:410px;margin:0 auto}
#cv-preview .cv-phone .cv-shell{grid-template-columns:minmax(0,1fr)}
#cv-preview .cv-phone .cv-side{display:none}
#cv-preview .cv-phone .cv-content{padding:24px 18px}
#cv-preview .cv-phone .cv-layout{grid-template-columns:minmax(0,1fr)}
#cv-preview .cv-phone .cv-overview{grid-column:1;grid-row:1;grid-template-columns:1fr 1fr}
#cv-preview .cv-phone .cv-energy{grid-column:1/-1}
#cv-preview .cv-phone .cv-energy-body{display:grid;grid-template-columns:136px minmax(0,1fr);gap:15px;align-items:center}
#cv-preview .cv-phone .cv-ring{width:130px;margin-bottom:10px}
#cv-preview .cv-phone .cv-energy-total{margin-bottom:0}
#cv-preview .cv-phone .cv-macro:first-child{margin-top:0}
#cv-preview .cv-phone .cv-journal{grid-column:1;grid-row:2}
#cv-preview .cv-phone .cv-bottom{display:flex}
#cv-preview .cv-phone .cv-days{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:20px}
#cv-preview .cv-phone .cv-days>.cv-icon-btn{display:inline-grid;grid-row:2}#cv-preview .cv-phone .cv-days>.cv-icon-btn:last-child{grid-column:7}
#cv-preview .cv-phone h1{font-size:27px}
#cv-preview .cv-phone .cv-header>.cv-pill{padding:11px}
#cv-preview .cv-phone .cv-card{padding:15px}
@media(max-width:850px){#cv-preview .cv-shell{grid-template-columns:minmax(0,1fr)}#cv-preview .cv-side{display:none}#cv-preview .cv-layout{grid-template-columns:minmax(0,1fr) 235px}#cv-preview .cv-bottom{display:flex}}
@media(max-width:600px){#cv-preview .cv-content{padding:22px 14px}#cv-preview .cv-layout{grid-template-columns:minmax(0,1fr)}#cv-preview .cv-overview{grid-column:1;grid-row:1;grid-template-columns:1fr 1fr}#cv-preview .cv-energy{grid-column:1/-1}#cv-preview .cv-journal{grid-column:1;grid-row:2}#cv-preview .cv-days{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#cv-preview .cv-days>.cv-icon-btn{display:inline-grid;grid-row:2}#cv-preview .cv-days>.cv-icon-btn:last-child{grid-column:7}#cv-preview .cv-header{gap:8px}#cv-preview .cv-card{padding:14px}#cv-preview .cv-food{gap:8px}#cv-preview .cv-food-kcal{font-size:12px}}
@media(prefers-reduced-motion:reduce){#cv-preview *{scroll-behavior:auto}}
</style>
<script>
(()=>{
const root=document.getElementById('cv-preview');
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const meals=[{name:'Petit-déjeuner',symbol:'sunrise',kcal:342,items:[['Flocons d’avoine','60 g · P 8 · L 4 · G 36',228,'wheat'],['Skyr nature','200 g · P 20 · L 0 · G 8',114,'milk']]},{name:'Déjeuner',symbol:'sun',kcal:844,items:[['Poulet, riz et légumes','Une portion · 550 g',844,'utensils']]},{name:'Dîner',symbol:'moon',kcal:0,items:[]},{name:'Collation',symbol:'apple',kcal:0,items:[]}];
root.querySelectorAll(':scope > section').forEach((section,index)=>{
const phone=section.dataset.layout==='phone';
section.innerHTML=`<div class="cv-app ${phone?'cv-phone':''}" aria-label="Accueil ${phone?'téléphone':'ordinateur'} ${section.dataset.theme==='dark'?'sombre':'clair'}"><div class="cv-shell"><aside class="cv-side"><div class="cv-brand"><span class="cv-logo">${icon('sprout')}</span>calovibe</div><nav aria-label="Navigation principale"><button class="cv-nav" aria-current="page">${icon('layout-dashboard')}Ma journée</button><button class="cv-nav" data-panel="Bibliothèque">${icon('book-open')}Bibliothèque</button><button class="cv-nav" data-panel="Poids et objectifs">${icon('target')}Mes objectifs</button><button class="cv-nav" data-panel="Paramètres">${icon('settings-2')}Paramètres</button></nav><div class="cv-side-foot">Mon espace personnel<br>Chaque jour compte.</div></aside><main class="cv-content"><header class="cv-header"><div><div class="cv-eyebrow">Mon journal</div><h1>Ma journée</h1><p class="cv-muted cv-date"></p></div><button class="cv-pill" data-add="0">${icon('plus')} Ajouter</button></header><div class="cv-days" aria-label="Choisir une date"><button class="cv-icon-btn" data-shift="-1" aria-label="Semaine précédente">${icon('chevron-left')}</button>${['Ven.','Sam.','Dim.','Lun.','Mar.','Mer.','Jeu.'].map((d,i)=>`<button class="cv-day" data-day="${16+i}" aria-pressed="${i===6}"><span class="cv-small">${d}</span><strong>${16+i}</strong></button>`).join('')}<button class="cv-icon-btn" data-shift="1" aria-label="Semaine suivante">${icon('chevron-right')}</button></div><div class="cv-layout"><aside class="cv-overview" aria-label="Bilan quotidien"><section class="cv-card cv-energy"><div class="cv-energy-top"><h2>Mon équilibre</h2>${icon('flame')}</div><div class="cv-energy-body"><div><div class="cv-ring" role="img" aria-label="1 186 kilocalories consommées sur un objectif de 2 450"><div class="cv-ring-core"><span class="cv-small cv-muted">Restant</span><strong class="cv-remaining">1 264</strong><span class="cv-small cv-muted">kcal</span></div></div><p class="cv-energy-total cv-small"><strong class="cv-consumed">1 186</strong><span class="cv-muted"> / 2 450 kcal</span></p></div><div>${[['Protéines','79','160',49],['Lipides','36','82',44],['Glucides','136','268',51]].map(m=>`<div class="cv-macro"><div class="cv-between cv-small"><span>${m[0]}</span><span>${m[1]} <span class="cv-muted">/ ${m[2]} g</span></span></div><div class="cv-track"><span style="width:${m[3]}%"></span></div></div>`).join('')}</div></div></section><section class="cv-card"><div class="cv-between"><h2>Eau</h2><span style="color:var(--cv-blue)">${icon('droplet')}</span></div><p class="cv-water-number"><span class="cv-water-value">1 250</span> <small>/ 2 500 ml</small></p><div class="cv-track"><span class="cv-water-fill" style="width:50%;background:var(--cv-blue)"></span></div><div class="cv-water-actions"><button class="cv-soft-btn" data-water="250">+ 250 ml</button><button class="cv-soft-btn" data-water="500">+ 500 ml</button></div><button class="cv-undo" data-undo hidden>Annuler l’ajout</button></section><section class="cv-card"><div class="cv-between"><h2>Poids</h2>${icon('scale')}</div><p class="cv-water-number">80 <small>kg</small></p><p class="cv-small cv-muted">Dernière pesée · aujourd’hui</p><button class="cv-soft-btn" data-panel="Enregistrer une pesée" style="margin-top:12px">Saisir mon poids</button></section></aside><section class="cv-journal" aria-label="Repas du jour"><div class="cv-section-title"><h2>Au fil des repas</h2><span class="cv-small cv-muted">4 repas</span></div><div class="cv-meals">${meals.map((m,i)=>`<section class="cv-card" style="margin-bottom:14px"><div class="cv-meal-head"><span class="cv-meal-symbol">${icon(m.symbol)}</span><div><div class="cv-meal-title">${m.name}</div><p class="cv-small cv-muted cv-meal-total">${m.kcal} kcal</p></div><button class="cv-icon-btn" data-add="${i}" aria-label="Ajouter au ${m.name}">${icon('plus')}</button></div><div class="cv-meal-items">${m.items.map(f=>`<div class="cv-food"><span class="cv-food-art">${icon(f[3])}</span><div class="cv-food-text"><div class="cv-food-name">${f[0]}</div><div class="cv-food-values">${f[1]}</div></div><span class="cv-food-kcal">${f[2]} <span class="cv-small cv-muted">kcal</span></span></div>`).join('')||'<p class="cv-empty">Rien d’enregistré pour le moment.</p>'}</div></section>`).join('')}</div><section class="cv-entry" hidden aria-label="Ajouter au journal"></section><p class="cv-status" aria-live="polite"></p></section></div></main></div><nav class="cv-bottom" aria-label="Navigation mobile"><button aria-current="page">${icon('house')}Ma journée</button><button data-panel="Bibliothèque">${icon('book-open')}Bibliothèque</button><button data-panel="Poids et objectifs">${icon('target')}Objectifs</button><button data-panel="Paramètres">${icon('settings-2')}Réglages</button></nav></div>`;
const app=section.querySelector('.cv-app'),status=app.querySelector('.cv-status');let water=1250,goal=2500,history=[];
app.querySelector('.cv-header > [data-add]').remove();
const waterCard=app.querySelector('.cv-water-value').closest('.cv-card');
waterCard.setAttribute('aria-label','Hydratation');
waterCard.innerHTML=`<div class="cv-between"><div class="cv-water-heading">${icon('droplet')}<h2>Eau</h2></div><button class="cv-edit-goal" data-water-dialog="goal" aria-label="Modifier l’objectif quotidien d’eau">${icon('pencil')}</button></div><p class="cv-water-number"><span class="cv-water-value">1 250</span> <small>/ <span class="cv-water-goal">2 500</span> ml</small></p><div class="cv-track" role="progressbar" aria-label="Objectif d’hydratation" aria-valuemin="0"><span class="cv-water-fill" style="width:50%;background:var(--cv-blue)"></span></div><div class="cv-water-actions"><button class="cv-soft-btn" data-water="250">${icon('glass-water')}+ 250 ml</button><button class="cv-soft-btn" data-water="500">${icon('bottle-wine')}+ 500 ml</button><button class="cv-soft-btn cv-water-custom" data-water-dialog="custom">${icon('plus')}Autre quantité</button></div><button class="cv-undo" data-undo hidden>Annuler l’ajout</button><p class="cv-water-note" aria-live="polite"></p><dialog class="cv-water-dialog" aria-labelledby="cv-water-title-${index}"><form><h2 id="cv-water-title-${index}">Ajouter de l’eau</h2><label>Quantité en millilitres<input type="number" name="millilitres" min="1" max="100000" step="1" required inputmode="numeric" autofocus></label><p class="cv-small cv-muted">Une quantité entière, supérieure à zéro.</p><div class="cv-entry-actions"><button class="cv-soft-btn" type="button" data-water-cancel>Annuler</button><button class="cv-pill" type="submit">Ajouter</button></div></form></dialog>`;
const extraWaterButton=document.createElement('button');extraWaterButton.className='cv-soft-btn';extraWaterButton.dataset.water='1000';extraWaterButton.innerHTML=`${icon('droplets')}+ 1 litre`;waterCard.querySelector('.cv-water-custom').before(extraWaterButton);
const waterDialog=waterCard.querySelector('dialog'),waterForm=waterDialog.querySelector('form'),waterInput=waterForm.elements.millilitres;let waterMode='custom',waterOpener=null;
function closeWaterDialog(){waterDialog.close();waterOpener?.focus();}
waterForm.addEventListener('submit',event=>{event.preventDefault();if(!waterForm.reportValidity())return;const value=Number(waterInput.value);if(!Number.isSafeInteger(value)||value<=0)return;if(waterMode==='goal'){history.push({water,goal});goal=value;waterCard.querySelector('.cv-water-note').textContent='Objectif mis à jour.';}else{history.push({water,goal});water+=value;waterCard.querySelector('.cv-water-note').textContent=`${fmt(value)} ml ajoutés.`;}waterRender();save();closeWaterDialog();});
waterDialog.addEventListener('cancel',()=>{setTimeout(()=>waterOpener?.focus(),0);});
const fmt=n=>n.toLocaleString('fr-FR');
const saved=window.openai?.widgetState?.privateContent?.variants?.[index];if(saved&&typeof saved.water==='number'){water=saved.water;}if(saved&&Number.isFinite(saved.goal)&&saved.goal>0){goal=saved.goal;}

const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(n);

function photoPreview(){return photoUrl?'<img class="cv-photo-preview" data-photo-preview alt="Photo choisie pour compléter le déjeuner">':`<div class="cv-photo-hero">${icon('camera')}<span>Un plat, une assiette ou un aliment</span></div>`;}
function refreshPhotoValues(){const sum=photoSum();flow.querySelectorAll('.cv-photo-totals [data-nutrient]').forEach(n=>n.textContent=fmt(sum[n.dataset.nutrient]));flow.querySelectorAll('[data-photo-kcal]').forEach(n=>{const item=photoItems[Number(n.dataset.photoKcal)];n.textContent=`${fmt(nutrition(item.food,item.quantity).k)} kcal`;});flow.querySelectorAll('[data-photo-name]').forEach(n=>n.textContent=photoItems[Number(n.dataset.photoName)].food.name||'Nouvel aliment');flow.querySelectorAll('.cv-photo-editor').forEach((editor,i)=>{let warning=editor.querySelector('.cv-review-warning');if(!warning){warning=document.createElement('div');warning.className='cv-review-warning';warning.innerHTML=`<span>Aliment modifié ou incomplet : vérifiez les valeurs pour 100 g.</span><button type="button" class="cv-soft-btn" data-photo-check-values="${i}">Confirmer ces valeurs</button>`;editor.append(warning);}warning.hidden=!photoItems[i].needsReview;if(photoItems[i].needsReview)editor.hidden=false;});const confirm=flow.querySelector('[data-photo-confirm]');if(confirm)confirm.disabled=!photoItems.length||photoItems.some(e=>!photoItemReady(e));redrawIcons();}
function photoItemHtml(e,i){const editorId=`cv-photo-edit-${index}-${i}`;return `<section class="cv-photo-item"><div class="cv-photo-compact-row"><span class="cv-meal-symbol cv-photo-symbol">${icon(e.food.icon)}</span><strong class="cv-photo-name" data-photo-name="${i}">${esc(e.food.name)||'Nouvel aliment'}</strong><label class="cv-photo-quantity"><span class="cv-photo-label-hidden">Quantité en grammes pour ${esc(e.food.name)||'le nouvel aliment'}</span><input data-photo-index="${i}" data-photo-key="quantity" type="number" value="${e.quantity}" min="0.1" max="100000" step="0.1" required inputmode="decimal"><span>g</span></label><span class="cv-photo-compact-kcal" data-photo-kcal="${i}">${fmt(nutrition(e.food,e.quantity).k)} kcal</span><button type="button" class="cv-edit-entry cv-photo-edit-toggle" data-photo-edit="${i}" aria-controls="${editorId}" aria-expanded="${!e.food.name}" aria-label="Corriger ${esc(e.food.name)||'le nouvel aliment'}">${icon('pencil')}</button><button type="button" class="cv-edit-entry cv-photo-remove" data-photo-remove="${i}" aria-label="Retirer ${esc(e.food.name)||'le nouvel aliment'}">${icon('trash-2')}</button></div><div class="cv-photo-editor" id="${editorId}" ${e.food.name?'hidden':''}><label>Nom de l’aliment<input data-photo-index="${i}" data-photo-key="name" value="${esc(e.food.name)}" maxlength="100" required></label><p class="cv-small cv-muted">Valeurs pour 100 g</p><div class="cv-custom-values">${[['k','kcal'],['p','Protéines · g'],['l','Lipides · g'],['g','Glucides · g']].map(([key,label])=>`<label>${label}<input type="number" data-photo-index="${i}" data-photo-key="${key}" value="${e.food[key]}" min="0" max="${key==='k'?1000:100}" step="0.1" inputmode="decimal" required></label>`).join('')}</div></div></section>`;}
function renderPhoto(){
const review=state.step==='photo-review',busy=state.step==='photo-analysis';
const title=review?'Vérifier mon assiette':busy?'Analyse de la photo':'Ajouter par photo';
const header=`<header class="cv-flow-head"><button class="cv-back" data-photo-back>${icon('arrow-left')}${review?'Changer de photo':'Retour'}</button><div class="cv-flow-kicker">DÉJEUNER · JEUDI 22 OCTOBRE</div><h1>${title}</h1><p class="cv-muted">${review?'Ajustez les aliments et les portions avant de confirmer.':busy?'Les aliments et les quantités sont en cours d’estimation.':'Complétez votre repas avec une nouvelle photo.'}</p></header><div class="cv-photo-step" aria-label="Étapes de l’ajout par photo"><span class="${!review?'cv-active-step':''}">1 · Photo</span>${icon('chevron-right')}<span class="${review?'cv-active-step':''}">2 · Vérification</span>${icon('chevron-right')}<span>3 · Ajout au repas</span></div>`;
let body='';
if(!review&&!busy){body=`<section class="cv-card"><h2>Votre photo</h2>${photoPreview()}${photoReady?`<p class="cv-small cv-muted">${esc(photoName)}</p>`:''}<div class="cv-photo-buttons"><button class="cv-soft-btn" data-photo-import>${icon('image-plus')}Choisir une photo</button><button class="cv-soft-btn" data-photo-camera>${icon('camera')}Prendre une photo</button></div><input type="file" accept="image/jpeg,image/png,image/webp" data-photo-file hidden aria-label="Choisir une image"><input type="file" accept="image/*" capture="environment" data-photo-capture hidden aria-label="Prendre une photo">${photoError?`<p class="cv-photo-error" role="alert">${esc(photoError)}</p>`:''}${photoReady?'<div class="cv-flow-actions"><button class="cv-pill" data-photo-analyze>Analyser la photo</button></div>':''}</section>`;}
if(busy){body=`<section class="cv-card"><div class="cv-photo-hero" role="status">${icon('scan-eye')}<strong>Identification des aliments…</strong></div><p class="cv-muted">Votre journal reste inchangé jusqu’à votre confirmation.</p><button class="cv-soft-btn" data-photo-stop style="margin-top:18px">Annuler l’analyse</button></section>`;}
if(review){body=`<form class="cv-card" data-photo-review-form novalidate><div class="cv-between"><h2>Éléments proposés</h2><span class="cv-source">${icon('sparkles')}Estimation</span></div><div class="cv-photo-note">Ajustez les portions. Touchez un aliment pour ouvrir ses détails et corriger ses valeurs.</div><div class="cv-photo-items">${photoItems.map(photoItemHtml).join('')||'<p class="cv-muted">Aucun aliment à ajouter. Ajoutez un élément ou choisissez une autre photo.</p>'}</div><button class="cv-soft-btn cv-photo-full" type="button" data-photo-missing>${icon('plus')}Ajouter un aliment oublié</button><div class="cv-photo-totals"><p class="cv-small cv-muted" style="margin-top:18px">À ajouter au déjeuner</p>${values(photoSum())}</div><div class="cv-flow-actions"><button type="button" class="cv-soft-btn" data-photo-cancel>Annuler</button><button type="submit" class="cv-pill" data-photo-confirm ${photoItems.length?'':'disabled'}>${icon('check')}Ajouter au déjeuner</button></div></form>`;}
flow.innerHTML=header+`<div class="cv-flow-columns"><div>${body}</div></div>`;
flow.querySelectorAll('[data-photo-preview]').forEach(img=>{img.src=photoUrl;});redrawIcons();
flow.querySelectorAll('.cv-photo-editor').forEach((editor,i)=>{const button=document.createElement('button');button.type='button';button.className='cv-soft-btn cv-photo-mobile-remove';button.dataset.photoRemove=i;button.innerHTML=`${icon('trash-2')}Supprimer cet aliment`;editor.append(button);});if(globalThis.lucide)lucide.createIcons();
if(review)refreshPhotoValues();
if(!review&&!busy&&photoItems.length){const resume=document.createElement('button');resume.className='cv-soft-btn cv-photo-full';resume.dataset.photoResume='';resume.textContent='Reprendre la vérification en cours';flow.querySelector('.cv-card').append(resume);}
}
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.closest('nav')&&b.getAttribute('aria-current')==='page'){event.stopImmediatePropagation();state.step='home';render();persist();return;}
if(b.hasAttribute('data-toggle-theme')){event.stopImmediatePropagation();const dark=section.dataset.theme!=='dark';section.dataset.theme=dark?'dark':'light';b.setAttribute('aria-pressed',String(dark));app.setAttribute('aria-label',`Accueil ${section.dataset.layout==='phone'?'téléphone':'ordinateur'} ${dark?'sombre':'clair'}`);return;}
if(b.dataset.date||b.dataset.shift||b.hasAttribute('data-today')){event.stopImmediatePropagation();const focusSelector=b.dataset.shift?`[data-shift="${b.dataset.shift}"]`:b.dataset.date?`[data-date="${b.dataset.date}"]`:'[data-today]';selectDay(b.dataset.date||(b.hasAttribute('data-today')?todayISO():shiftDate(state.date,Number(b.dataset.shift)*7)));app.querySelector(focusSelector)?.focus({preventScroll:true});return;}
if(b.dataset.baseEdit!==undefined){state.editingBase=Number(b.dataset.baseEdit);setMeal(state.baseline[state.editingBase].meal);state.step='base-edit';notice.hidden=true;render();persist();}
if(b.dataset.baseRemove!==undefined){rememberJournal();state.baseline.splice(Number(b.dataset.baseRemove),1);state.step='home';render();journalMessage('Entrée retirée du journal.');persist();}
if(b.hasAttribute('data-undo-journal')&&journalUndo){state.days[journalUndo.date].baseline=journalUndo.baseline;state.days[journalUndo.date].entries=journalUndo.entries;if(journalUndo.date===state.date){state.baseline=journalUndo.baseline;state.entries=journalUndo.entries;}journalUndo=null;notice.hidden=true;state.step='home';render();persist();}
if(b.hasAttribute('data-photo-resume')){state.step='photo-review';render();persist();}
if(b.dataset.photoCheckValues!==undefined){const item=photoItems[Number(b.dataset.photoCheckValues)],editor=b.closest('.cv-photo-editor');if(!Array.from(editor.querySelectorAll('input')).every(input=>input.reportValidity())||!item.food.name.trim())return;item.needsReview=false;item.referenceName=item.food.name;refreshPhotoValues();persist();}
if(b.hasAttribute('data-photo-import'))flow.querySelector('[data-photo-file]').click();
if(b.hasAttribute('data-photo-camera'))flow.querySelector('[data-photo-capture]').click();
if(b.hasAttribute('data-photo-analyze')){const job=++photoJob;state.step='photo-analysis';render();setTimeout(()=>{if(job!==photoJob||state.step!=='photo-analysis')return;photoItems=photoExample();state.step='photo-review';render();},900);}
if(b.hasAttribute('data-photo-stop')||b.hasAttribute('data-photo-back')){photoJob++;state.step=state.step==='photo-pick'?'methods':'photo-pick';photoError='';render();}
if(b.hasAttribute('data-photo-cancel')){photoJob++;state.step='home';render();notice.textContent='Proposition conservée pour ce repas, sans ajout au journal.';notice.hidden=false;persist();}
if(b.dataset.photoRemove!==undefined){photoItems.splice(Number(b.dataset.photoRemove),1);render();persist();}
if(b.dataset.photoEdit!==undefined){const editor=flow.querySelector(`#${b.getAttribute('aria-controls')}`);editor.hidden=!editor.hidden;flow.querySelectorAll(`[aria-controls="${editor.id}"]`).forEach(control=>control.setAttribute('aria-expanded',String(!editor.hidden)));if(!editor.hidden)editor.querySelector('input').focus();}
if(b.hasAttribute('data-photo-missing')){photoItems.push({food:{name:'',k:'',p:'',l:'',g:'',icon:'utensils'},quantity:100,needsReview:true});render();flow.querySelectorAll('[data-photo-key="name"]')[photoItems.length-1].focus();persist();}
if(b.hasAttribute('data-undo-photo')){state.entries.splice(-lastPhotoBatch,lastPhotoBatch);lastPhotoBatch=0;notice.hidden=true;updateHome();redrawIcons();persist();}
},true);
flow.addEventListener('change',event=>{const input=event.target;if(!input.hasAttribute('data-photo-file')&&!input.hasAttribute('data-photo-capture'))return;const file=input.files?.[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>10*1024*1024){photoError='Choisissez une image JPG, PNG ou WebP de moins de 10 Mo.';render();return;}const reader=new FileReader(),job=++photoJob;reader.onload=()=>{if(job!==photoJob||state.step!=='photo-pick')return;photoUrl=reader.result;photoName=file.name;photoReady=true;photoError='';render();};reader.onerror=()=>{photoError='Impossible de lire cette image. Choisissez une autre photo.';render();};reader.readAsDataURL(file);});
flow.addEventListener('input',event=>{const input=event.target;if(input.dataset.photoIndex===undefined)return;const item=photoItems[Number(input.dataset.photoIndex)],key=input.dataset.photoKey;if(key==='name'){item.referenceName??=item.food.name;item.food.name=input.value;item.needsReview=input.value.trim()!==item.referenceName.trim();}else if(key==='quantity'){if(input.validity.valid)item.quantity=Number(input.value);}else{item.food[key]=input.value===''?'':Number(input.value);}refreshPhotoValues();persist();});
flow.addEventListener('click',event=>{if(event.target.closest('button,input,select,textarea,label,a,summary,svg,[data-lucide],.cv-photo-symbol,.cv-kcal-symbol'))return;const row=event.target.closest('.cv-photo-compact-row');if(row)row.querySelector('.cv-photo-edit-toggle').click();});
flow.addEventListener('invalid',event=>{const editor=event.target.closest('.cv-photo-editor');if(editor){editor.hidden=false;flow.querySelectorAll(`[aria-controls="${editor.id}"]`).forEach(control=>control.setAttribute('aria-expanded','true'));}},true);
flow.addEventListener('input',event=>{if(!event.target.hasAttribute('data-base-quantity')||!event.target.validity.valid)return;const v=nutrition(state.baseline[state.editingBase].food,Number(event.target.value));flow.querySelectorAll('[data-nutrient]').forEach(n=>n.textContent=fmt(v[n.dataset.nutrient]));});
flow.addEventListener('submit',event=>{if(!event.target.hasAttribute('data-base-form'))return;event.preventDefault();event.stopImmediatePropagation();if(!event.target.reportValidity())return;rememberJournal();state.baseline[state.editingBase].quantity=Number(event.target.elements.basequantity.value);state.step='home';render();journalMessage('Quantité mise à jour.');persist();},true);
app.addEventListener('click',event=>{if(event.target.closest('button,input,svg,[data-lucide]'))return;const row=event.target.closest('.cv-home-row');row?.querySelector('.cv-home-name')?.click();});
flow.addEventListener('submit',event=>{const form=event.target;if(!form.hasAttribute('data-photo-review-form'))return;event.preventDefault();event.stopImmediatePropagation();if(!form.reportValidity()||!photoItems.length||photoItems.some(e=>!photoItemReady(e)))return;rememberJournal();lastPhotoBatch=photoItems.length;state.entries.push(...photoItems.map(e=>({food:{...e.food,name:e.food.name.trim()},quantity:e.quantity,source:'photo',meal:state.targetMeal})));photoItems=[];state.step='home';render();journalMessage(`${lastPhotoBatch} aliments ajoutés ${mealPhrase()}.`);persist();targetCard().scrollIntoView({block:'nearest',behavior:'instant'});targetCard().querySelector('[data-add]').focus({preventScroll:true});},true);
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;
if(b.dataset.add!==undefined){event.stopImmediatePropagation();setMeal(Number(b.dataset.add));state.step='methods';state.editing=null;notice.hidden=true;render();persist();}
if(b.dataset.flowMethod){state.method=b.dataset.flowMethod;state.step=state.method==='manual'?'search':state.method==='photo'?'photo-pick':'future';render();persist();}
if(b.hasAttribute('data-flow-back')){const editedEntry=state.editing;state.step=previousStep(state);state.editing=null;render();persist();if(state.step==='home'&&editedEntry!==null)app.querySelector(`.cv-home-name[data-edit-entry="${editedEntry}"]`)?.focus({preventScroll:false});}
if(b.hasAttribute('data-flow-cancel')){state.step='home';state.editing=null;render();persist();}
if(b.dataset.selectFood!==undefined){state.returnTo='search';state.editing=null;state.selected=Number(b.dataset.selectFood);state.quantity=state.selected===0?200:state.selected===3?10:100;state.step='edit';render();persist();}
if(b.hasAttribute('data-custom-food')){state.step='custom';render();persist();}
if(b.dataset.editEntry!==undefined){state.returnTo='home';state.editing=Number(b.dataset.editEntry);setMeal(state.entries[state.editing].meal??1);state.quantity=state.entries[state.editing].quantity;state.step='edit';render();persist();}
if(b.dataset.deleteEntry!==undefined){rememberJournal();state.entries.splice(Number(b.dataset.deleteEntry),1);render();journalMessage('Aliment retiré du déjeuner.');persist();}
if(b.hasAttribute('data-undo-food')){state.entries.pop();notice.hidden=true;updateHome();redrawIcons();persist();}
},true);
flow.addEventListener('input',event=>{if(event.target.closest('[data-custom-form]')){const field=event.target;state.customDraft[field.name==='foodname'?'name':field.name]=field.value;persist();}if(event.target.hasAttribute('data-food-search')){state.search=event.target.value;const term=event.target.value.toLocaleLowerCase('fr').trim();const results=flow.querySelectorAll('[data-food-name]');let count=0;results.forEach(r=>{r.hidden=!r.dataset.foodName.includes(term);r.style.display=r.hidden?'none':'';if(!r.hidden)count++;});flow.querySelector('[data-empty-results]').hidden=count!==0;}
if(event.target.name==='quantity'){const q=Number(event.target.value);if(!event.target.validity.valid)return;state.quantity=q;const food=state.editing!==null?state.entries[state.editing].food:state.selected===-1?draft:foods[state.selected];const v=nutrition(food,q);flow.querySelectorAll('[data-nutrient]').forEach(n=>n.textContent=fmt(v[n.dataset.nutrient]));}});
flow.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;
if(form.hasAttribute('data-custom-form')){draft={name:form.elements.foodname.value.trim(),icon:'utensils',...Object.fromEntries(['k','p','l','g'].map(k=>[k,Number(form.elements[k].value)]))};if(!draft.name)return;state.returnTo='custom';state.editing=null;state.selected=-1;state.quantity=100;state.step='edit';render();persist();}
else if(form.hasAttribute('data-portion-form')){const quantity=Number(form.elements.quantity.value);if(!Number.isFinite(quantity)||quantity<=0)return;const editing=state.editing!==null;const food=editing?state.entries[state.editing].food:state.selected===-1?draft:foods[state.selected];const entry={food:{...food},quantity,source:editing?state.entries[state.editing].source:'manual',meal:state.targetMeal};rememberJournal();if(editing)state.entries[state.editing]=entry;else state.entries.push(entry);state.editing=null;state.step='home';render();journalMessage(`${food.name} ${editing?'corrigé':'ajouté'} ${mealPhrase()}.`);persist();targetCard().scrollIntoView({block:'nearest',behavior:'instant'});targetCard().querySelector('[data-add]').focus({preventScroll:true});}
});
state.baseline=currentDay().baseline;state.entries=currentDay().entries;app.dispatchEvent(new CustomEvent('cv:hydrate',{detail:currentDay()}));render();
});
})();
</script>
