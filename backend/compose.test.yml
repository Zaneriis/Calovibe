services:
  postgres:
    image: postgres:18.6-bookworm@sha256:6b38fe68f2c02cafffbbce7496f76d110d8a947c039bd22c067e9a43c2250240
    environment:
      POSTGRES_DB: calovibe_test
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap-password
    volumes:
      - database:/var/lib/postgresql
      - '${BE_SECRET_DIR:?test runner required}/bootstrap-password:/run/secrets/bootstrap-password:ro'
      - '${BE_SECRET_DIR:?test runner required}/bootstrap.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bootstrap -d calovibe_test']
      interval: 1s
      timeout: 2s
      retries: 40
    networks: [data]
    mem_limit: 512m
    pids_limit: 128
  jwks:
    image: 'calovibe-backend-jwks:${BE_VERSION:?SHA required}'
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: test-jwks
      args: { GIT_SHA: '${BE_VERSION:?SHA required}' }
    volumes:
      - '${BE_SECRET_DIR:?test runner required}/tls.key:/run/fixtures/tls.key:ro'
      - '${BE_SECRET_DIR:?test runner required}/tls.crt:/run/fixtures/tls.crt:ro'
      - '${BE_SECRET_DIR:?test runner required}/jwks.json:/run/fixtures/jwks.json:ro'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [data]
    mem_limit: 128m
    pids_limit: 64
  backend:
    image: 'calovibe-backend:${BE_VERSION:?SHA required}'
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
      args: { GIT_SHA: '${BE_VERSION:?SHA required}' }
    environment:
      DATABASE_CONFIG_FILE: /run/secrets/database.json
      OIDC_ISSUER: https://identity.test/realms/calovibe
      OIDC_JWKS_URL: https://jwks:9443/jwks
      API_AUDIENCE: https://api.test
      NODE_EXTRA_CA_CERTS: /run/secrets/test-ca.crt
    ports: ['127.0.0.1::3000']
    volumes:
      - '${BE_SECRET_DIR:?test runner required}/runtime.json:/run/secrets/database.json:ro'
      - '${BE_SECRET_DIR:?test runner required}/tls.crt:/run/secrets/test-ca.crt:ro'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 8s
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [data]
    mem_limit: 256m
    pids_limit: 64
  migrate:
    image: 'calovibe-backend:${BE_VERSION:?SHA required}'
    command: [node, dist/migrate.js]
    environment:
      MIGRATION_DATABASE_FILE: /run/secrets/migration.json
      OWNER_CONFIG_FILE: /run/secrets/owner.json
    volumes:
      - '${BE_SECRET_DIR:?test runner required}/migration.json:/run/secrets/migration.json:ro'
      - '${BE_SECRET_DIR:?test runner required}/owner.json:/run/secrets/owner.json:ro'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [data]
    mem_limit: 256m
    pids_limit: 64
networks:
  data: { internal: true }
volumes:
  database:
