name: Web image
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-image:
    name: Image web indépendante et smoke du runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Identifier le commit réellement construit
        shell: bash
        run: |
          version=$(git rev-parse HEAD)
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=calovibe-web:$version" >> "$GITHUB_ENV"
      - name: Construire seulement web et vérifier sa vraie entrée
        run: node web/tests/image-smoke.cjs
